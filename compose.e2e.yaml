services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: engageops_e2e
      POSTGRES_USER: engageops_e2e
      POSTGRES_PASSWORD: e2e-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engageops_e2e -d engageops_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

  backend:
    image: engageops-e2e-backend
    build:
      context: .
      dockerfile: src/backend/EngageOps.Api/Dockerfile
    command: ["dotnet", "run", "--project", "src/backend/EngageOps.Api", "--no-launch-profile", "--no-restore"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: true
      ConnectionStrings__Database: Host=postgres;Database=engageops_e2e;Username=engageops_e2e;Password=e2e-only
      Logging__LogLevel__Default: Warning
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
