name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_DB: engageops
      POSTGRES_USER: engageops
      POSTGRES_PASSWORD: ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate development-data shell syntax
        run: sh -n scripts/development-data.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EngageOps.slnx

      - name: Verify formatting
        run: >
          dotnet format EngageOps.slnx
          --verify-no-changes
          --no-restore

      - name: Build
        run: >
          dotnet build EngageOps.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          --solution EngageOps.slnx
          --configuration Release
          --no-build

      # Hosted runners may bundle Compose versions too old for develop.watch.initial_sync.
      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build backend frontend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          package-json-file: src/frontend/package.json
          install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # This job owns cache writes; browser journeys only restore the shared store.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/frontend/pnpm-lock.yaml', 'src/frontend/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          package-json-file: src/frontend/package.json
          install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/frontend/pnpm-lock.yaml', 'src/frontend/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser journeys
        run: pnpm test:e2e

      - name: Upload browser report and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
            src/frontend/e2e-artifacts/
          retention-days: 7
